name: Build Windows (custom)

on:
  workflow_dispatch:
  push:
    branches:
      - custom-providers

permissions:
  contents: write
  actions: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          runtime: node@26.7.0
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.1'
          use-dotnet: true
          include-templates: true

      - name: Export Godot Stage (Windows)
        working-directory: ./engines/stage-tamagotchi-godot
        shell: bash
        run: |
          mkdir -p out/win
          godot --headless --export-release "Windows Desktop" out/win/godot-stage.exe

      - name: Build Windows installer
        run: pnpm run -F @proj-airi/stage-tamagotchi build && pnpm -F @proj-airi/stage-tamagotchi exec electron-builder build --windows --x64 --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: AIRI-windows-x64
          path: |
            apps/stage-tamagotchi/dist/*.exe
            apps/stage-tamagotchi/bundle/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-providers-screen-stream-24
          name: Screen stream 24 — LLM Live2D sort + chat poses (Windows)
          prerelease: true
          make_latest: true
          files: |
            apps/stage-tamagotchi/dist/*.exe
            apps/stage-tamagotchi/bundle/*.exe
          body: |
            Полный Windows-установщик из CI. База — живой 12.

            **24**
            - «Разложить самой» читает имена через твою чат-модель, не словарик под Мику. Непонятное не кладёт.
            - Чат всегда видит выражения/анимации текущей модели и ставит позу скрытым тегом.
            - Работает и без exp3 — одних motion имён достаточно.

            Если SmartScreen ругается: More info → Run anyway.





        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
